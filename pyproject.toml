[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "answerbench"
version = "0.1.0a1"
description = "Auditable measurement of AI entity recommendations across user journeys"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
answerbench = "answerbench.cli:main"

[tool.setuptools.packages.find]
include = ["answerbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
